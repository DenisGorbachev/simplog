[workspace]
members = ["packages/simplog_direct", "packages/simplog_lazy_lock"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
homepage = "https://github.com/DenisGorbachev/simplog"
repository = "https://github.com/DenisGorbachev/simplog"
keywords = []
categories = []
exclude = [
    ".*",
    "*.local.*",
    "doc/dev",
    "specs",
    "AGENTS.ts",
    "CargoMetadata.ts",
    "README.ts",
    "AGENTS*.md",
    "deno.lock",
    "deno.json",
    "clippy.toml",
    "commitlint.config.mjs",
    "fnox.toml",
    "mise.toml",
    "nu-lint.toml",
    "nufmt.nuon",
    "rumdl.toml",
    "shuck.toml",
    "rustfmt.toml",
    "rust-toolchain.toml",
    "skills-lock.json",
    ".yolobox"
]

[workspace.metadata.details]
name = "simplog"
title = ""
readme = { generate = false }

[workspace.dependencies]
derive-new = "0.7.0"
derive_more = { version = "2.1.1", features = ["full"] }
gix-hash = { version = "0.28.0", features = ["sha1"] }
hex-literal = "1.1.0"
url = "2.5.8"
derive-getters = { version = "0.5.0", features = ["auto_copy_getters"] }
errgonomic = { git = "https://github.com/DenisGorbachev/errgonomic" }
itertools = "0.15.0"
standard-traits = { git = "https://github.com/DenisGorbachev/standard-traits" }
strum = { version = "0.28.0", features = ["derive"] }
stub-macro = { version = "0.3.1" }
subtype = { git = "https://github.com/DenisGorbachev/subtype" }
timestamp-please = { git = "https://github.com/DenisGorbachev/timestamp-please", features = ["serde", "time"] }
interval-zoo = { git = "https://github.com/DenisGorbachev/interval-zoo" }
url-macro = "0.2.5"

[workspace.lints.rust]
redundant_imports = "deny"
unused_import_braces = "deny"
# unused_qualifications must not be "deny" because our code style has multiple `use Foo::*;`, and some macros (derive_more::Display, strum::Display, strum::EnumString) produce code with full qualifications
# unused_qualifications = "deny"

[workspace.lints.clippy]
absolute_paths = "deny"
arithmetic_side_effects = "deny"
